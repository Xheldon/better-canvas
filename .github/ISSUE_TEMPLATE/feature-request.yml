name: "Feature request / design feedback"
description: "Suggest an improvement to the read-only preview or MCP workflow."
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What should Better Canvas do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why? What scenario fails without it?
    validations:
      required: true
  - type: input
    id: decision
    attributes:
      label: Related design decision (if any)
      description: "See docs/compatibility.md and CLAUDE.md"
